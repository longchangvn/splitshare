server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Same-origin /api proxy: the web app calls relative URLs so no CORS
  # is needed (Vite does the equivalent in dev via vite.config.js).
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
