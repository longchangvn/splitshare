name: CD API — Azure Container Apps

# MANUAL ONLY (workflow_dispatch — no push/merge automation). Builds the api/
# image, pushes it to ACR and deploys it to the container app in RG
# `splitshare`. Creates what's missing (resource group, ACR, Container Apps
# environment, container app) and updates an existing container app in place —
# image, env vars, ingress and registry config — without ever deleting it.
#
# Every push/merge is gated by the build-only "CI API" workflow instead; this
# CD workflow is what turns a green commit into a deployment.
#
# CORS: if the Static Web App already exists, its origin is allowed on the
# API (best effort). The "CD Web" workflow is the one that guarantees it
# after the SWA is created.

on:
  workflow_dispatch:
    inputs:
        environment:
          description: "Select deployment environment"
          required: true
          type: environment
# Same group as cd-web.yml so the two never mutate Azure concurrently.
concurrency:
  group: deploy-azure-main
  cancel-in-progress: false

permissions:
  id-token: write        # OIDC token for azure/login
  contents: read         # checkout

env:
  RG: splitshare
  CA_NAME: ${{ vars.SPLITSHARE_CONTAINER_APP_NAME || 'api-container' }}
  SWA_NAME: ${{ vars.SPLITSHARE_SWA_NAME || 'splitshare' }}
  LOCATION_DEFAULT: ${{ vars.SPLITSHARE_LOCATION || 'southcentralus' }}
  REG_URL_VAR: ${{ vars.SPLITSHARE_REGISTRY_URL }}
  ASPNET_ENV: Production

jobs:
  deploy-api:
    name: Build & deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SPLITSHARE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SPLITSHARE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SPLITSHARE_AZURE_SUBSCRIPTION_ID }}

      # Single step so secrets (JWT key, registry password) never pass
      # through step outputs.
      - name: Provision Azure resources & deploy API
        env:
          JWT_KEY_SECRET: ${{ secrets.SPLITSHARE_JWT_KEY }}
          # Google login audience. Must match the VITE_GOOGLE_CLIENT_ID that
          # cd-web.yml bakes into the SPA, or token verification fails.
          GOOGLE_CLIENT_ID_SECRET: ${{ secrets.SPLITSHARE_GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail

          echo "=== 1/7 Resource group ==="
          # az group create errors when the group exists with a different
          # location, so only pass --location when actually creating.
          if [ "$(az group exists --name "$RG")" = "true" ]; then
            echo "Resource group '$RG' already exists."
          else
            az group create --name "$RG" --location "$LOCATION_DEFAULT" --output none
            echo "Created resource group '$RG'."
          fi
          LOC=$(az group show --name "$RG" --query location -o tsv)
          SUB_ID=$(az account show --query id -o tsv)
          echo "Resource group '$RG' in $LOC (subscription $SUB_ID)"

          # Free-credit subscriptions start unregistered for providers they
          # have never used. Registering needs subscription-level rights the
          # deployment principal doesn't have, so this is best effort — the
          # ACR step below fails with an actionable message if it's missing.
          echo "=== Registering Azure resource providers (best effort) ==="
          for P in Microsoft.ContainerRegistry Microsoft.App Microsoft.OperationalInsights; do
            STATE=$(az provider show --namespace "$P" --query registrationState -o tsv 2>/dev/null || echo "Unknown")
            if [ "$STATE" = "Registered" ]; then
              echo "$P: already registered."
              continue
            fi
            echo "$P: registering (state: $STATE) — first use, can take a few minutes..."
            if az provider register --namespace "$P" --wait --output none 2>&1 | tee /tmp/reg.log; then
              echo "$P: registered."
            else
              echo "::warning::$P could not be registered by this principal (needs subscription Owner rights). Register it once as Owner: az provider register --namespace $P"
            fi
          done
          if [ "$(az provider show --namespace Microsoft.ContainerRegistry --query registrationState -o tsv 2>/dev/null || true)" != "Registered" ]; then
            echo "::error::Microsoft.ContainerRegistry is not registered and this principal cannot register it. As subscription Owner run once: az provider register --namespace Microsoft.ContainerRegistry  (or Azure Portal > Subscriptions > Resource providers > Microsoft.ContainerRegistry > Register), then re-run this workflow."
            exit 1
          fi

          echo "=== 2/7 Container registry ==="
          ACR_NAME=""
          if [ -n "$REG_URL_VAR" ]; then
            CAND=$(echo "$REG_URL_VAR" | cut -d. -f1 | tr '[:upper:]' '[:lower:]')
            if az acr show --name "$CAND" --resource-group "$RG" --output none 2>/dev/null; then
              ACR_NAME="$CAND"
              echo "Using registry from vars.SPLITSHARE_REGISTRY_URL: $ACR_NAME"
            else
              echo "Registry '$CAND' from vars not found in '$RG'."
            fi
          fi
          if [ -z "$ACR_NAME" ]; then
            # Prefer whatever registry already lives in the RG (e.g. one
            # created manually in the portal) over creating a second one.
            FIRST=$(az acr list --resource-group "$RG" --query "[0].name" -o tsv 2>/dev/null || true)
            if [ -n "${FIRST:-}" ] && [ "$FIRST" != "None" ] && [ "$FIRST" != "null" ]; then
              ACR_NAME="$FIRST"
              echo "Using existing registry in '$RG': $ACR_NAME"
            fi
          fi
          if [ -z "$ACR_NAME" ]; then
            ACR_NAME="splitshare$(echo "$SUB_ID" | tr -d '-' | cut -c1-8)"
          fi
          if az acr show --name "$ACR_NAME" --resource-group "$RG" --output none 2>/dev/null; then
            echo "Registry '$ACR_NAME' already exists."
          else
            az acr create --name "$ACR_NAME" --resource-group "$RG" \
              --sku Basic --admin-enabled true --output none
            echo "Created registry '$ACR_NAME'."
          fi
          # Registry auth for the container app uses admin credentials.
          az acr update --name "$ACR_NAME" --resource-group "$RG" --admin-enabled true --output none
          REG_SERVER=$(az acr show --name "$ACR_NAME" --resource-group "$RG" --query loginServer -o tsv)
          ACR_USER="$ACR_NAME"
          ACR_PASS=""
          for i in 1 2 3 4 5; do
            ACR_PASS=$(az acr credential show --name "$ACR_NAME" --resource-group "$RG" \
              --query "passwords[0].value" -o tsv 2>/dev/null || true)
            if [ -n "$ACR_PASS" ]; then break; fi
            sleep 3
          done
          if [ -z "$ACR_PASS" ]; then
            echo "::error::Could not read admin credentials for '$ACR_NAME'."
            exit 1
          fi
          echo "::add-mask::$ACR_PASS"
          echo "Registry: $REG_SERVER"

          echo "=== 3/7 Build & push API image ==="
          # Built on the runner instead of with ACR Tasks (az acr build):
          # this subscription rejects Tasks runs with TasksOperationsNotAllowed,
          # while a plain image push to the registry works fine.
          echo "Registry SKU: $(az acr show --name "$ACR_NAME" --resource-group "$RG" --query sku.name -o tsv)"
          docker login "$REG_SERVER" --username "$ACR_USER" --password-stdin <<< "$ACR_PASS"
          # Build context is the repo root (required by api/Dockerfile).
          docker build -f api/Dockerfile -t "$REG_SERVER/splitshare:$GITHUB_SHA" .
          docker push "$REG_SERVER/splitshare:$GITHUB_SHA"
          IMAGE="$REG_SERVER/splitshare:$GITHUB_SHA"

          echo "=== 4/7 Container Apps environment ==="
          # Subscription quota: max 1 environment per region -> always reuse
          # an existing one (RG first, then region-wide, then any) and only
          # create when the subscription genuinely has none.
          ENV_ID=""
          CA_ENV_ID=$(az containerapp show --name "$CA_NAME" --resource-group "$RG" \
            --query properties.managedEnvironmentId -o tsv 2>/dev/null || true)
          if [ -n "$CA_ENV_ID" ]; then
            ENV_ID="$CA_ENV_ID"
            echo "Existing container app uses environment '${ENV_ID##*/}'."
          else
            ENV_ID=$(az containerapp env list --resource-group "$RG" --query "[?location=='$LOC'].id | [0]" -o tsv 2>/dev/null || true)
            if [ -z "$ENV_ID" ] || [ "$ENV_ID" = "None" ] || [ "$ENV_ID" = "null" ]; then
              ENV_ID=$(az containerapp env list --resource-group "$RG" --query "[0].id" -o tsv 2>/dev/null || true)
            fi
            if [ -z "$ENV_ID" ] || [ "$ENV_ID" = "None" ] || [ "$ENV_ID" = "null" ]; then
              ENV_ID=$(az containerapp env list --query "[?location=='$LOC'].id | [0]" -o tsv 2>/dev/null || true)
            fi
            if [ -z "$ENV_ID" ] || [ "$ENV_ID" = "None" ] || [ "$ENV_ID" = "null" ]; then
              ENV_NAME="splitshare-env"
              az containerapp env create --name "$ENV_NAME" --resource-group "$RG" \
                --location "$LOC" --logs-destination none --output none
              ENV_ID=$(az containerapp env show --name "$ENV_NAME" --resource-group "$RG" --query id -o tsv)
              echo "Created environment '$ENV_NAME'."
            else
              echo "Reusing existing environment '${ENV_ID##*/}' (subscription allows only 1 per region)."
            fi
          fi

          echo "=== 5/7 JWT key ==="
          # Production refuses to boot without a >=32 char key. Prefer the
          # GitHub secret; otherwise reuse what's already configured on the
          # app (so sessions survive); otherwise generate one and persist it.
          JWT_KEY="$JWT_KEY_SECRET"
          if [ -z "$JWT_KEY" ]; then
            EXISTING=$(az containerapp show --name "$CA_NAME" --resource-group "$RG" \
              --query "properties.template.containers[0].env[?name=='Jwt__Key'].value | [0]" \
              -o tsv 2>/dev/null || true)
            if [ -n "${EXISTING:-}" ] && [ "$EXISTING" != "null" ] && [ "${#EXISTING}" -ge 32 ] \
              && [ "$EXISTING" != "dev-only-insecure-key-change-in-prod-0123456789" ]; then
              JWT_KEY="$EXISTING"
              echo "Reusing the Jwt__Key already configured on '$CA_NAME'."
            else
              JWT_KEY=$(openssl rand -hex 32)
              echo "::warning::SPLITSHARE_JWT_KEY secret is not set — generated a random JWT key and stored it on '$CA_NAME'. Set the GitHub secret to pin it."
            fi
          fi
          if [ "${#JWT_KEY}" -lt 32 ]; then
            echo "::error::Jwt key must be at least 32 characters."
            exit 1
          fi
          echo "::add-mask::$JWT_KEY"

          # Google OAuth audience for /auth/google (see api/Auth/GoogleVerifier.cs).
          # Must be identical to the VITE_GOOGLE_CLIENT_ID that cd-web.yml bakes
          # into the SPA, otherwise the token is rejected as the wrong audience.
          # Prefer the GitHub secret; otherwise keep what's already configured so
          # a re-run without the secret set doesn't silently disable Google login.
          GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID_SECRET"
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            EXISTING_GCID=$(az containerapp show --name "$CA_NAME" --resource-group "$RG" \
              --query "properties.template.containers[0].env[?name=='Auth__GoogleClientId'].value | [0]" \
              -o tsv 2>/dev/null || true)
            if [ -n "${EXISTING_GCID:-}" ] && [ "$EXISTING_GCID" != "null" ]; then
              GOOGLE_CLIENT_ID="$EXISTING_GCID"
              echo "Reusing the Auth__GoogleClientId already configured on '$CA_NAME'."
            else
              echo "::warning::SPLITSHARE_GOOGLE_CLIENT_ID secret is not set — Google login stays disabled (POST /auth/google returns 'Auth:GoogleClientId not configured')."
            fi
          fi
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_ID"
            echo "Google client ID configured (audience for ID tokens)."
          fi

          echo "=== 6/7 Container app: $CA_NAME ==="
          # CORS origin: allow the SWA origin if the SWA exists (best effort;
          # cd-web.yml sets it right after creating/verifying the SWA).
          SWA_CORS=""
          SWA_HOST=$(az staticwebapp show --name "$SWA_NAME" --resource-group "$RG" \
            --query "defaultHostname || properties.defaultHostname" -o tsv 2>/dev/null || true)
          if [ -n "${SWA_HOST:-}" ] && [ "$SWA_HOST" != "None" ]; then
            SWA_CORS="https://$SWA_HOST"
            echo "Will allow origin: $SWA_CORS"
          else
            echo "Static Web App '$SWA_NAME' not found yet — skipping CORS origin (cd-web.yml will set it)."
          fi

          # App__BaseUrl drives invite/share links (App:BaseUrl, web origin).
          # Repo var wins (custom domains); else the SWA default hostname.
          WEB_BASE="${{ vars.SPLITSHARE_WEB_BASE_URL }}"
          if [ -z "$WEB_BASE" ] && [ -n "${SWA_HOST:-}" ] && [ "$SWA_HOST" != "None" ]; then
            WEB_BASE="https://$SWA_HOST"
          fi
          if [ -n "$WEB_BASE" ]; then
            echo "Invite/share links will use: $WEB_BASE"
          else
            echo "::warning::Web base URL unknown (no SPLITSHARE_WEB_BASE_URL var; SWA '$SWA_NAME' not found) — App__BaseUrl skipped; links keep the localhost default until a later run."
          fi

          # Generic env sync: forward all allowlisted GitHub env vars/secrets to the
          # container app, but only if not already configured there (existing values win).
          EXISTING_NAMES=$(az containerapp show --name "$CA_NAME" --resource-group "$RG" \
            --query "properties.template.containers[0].env[].name" -o tsv 2>/dev/null || true)
          ENV_SYNC_NAMES=()
          ENV_SYNC_VALUES=()
          ENV_SYNC_SECRETS=()
          env_sync_add() {
            local name="$1" value="$2" is_secret="$3"
            if [ -z "$value" ]; then return; fi
            if echo "$EXISTING_NAMES" | grep -qxF "$name"; then
              echo "Skipping $name — already configured on container app."
              return
            fi
            if [ "$is_secret" = "true" ]; then
              echo "::add-mask::$value"
            fi
            ENV_SYNC_NAMES+=("$name")
            ENV_SYNC_VALUES+=("$value")
            ENV_SYNC_SECRETS+=("$is_secret")
            echo "Will set $name from GitHub environment."
          }
          env_sync_add "Notification__Provider" "${{ vars.NOTIFICATION_PROVIDER }}" "false"
          env_sync_add "Notification__OneSignal__AppId" "${{ vars.ONESIGNAL_APP_ID }}" "false"
          env_sync_add "Notification__OneSignal__ApiKey" "${{ secrets.ONESIGNAL_REST_API_KEY }}" "true"

          CA_URL="https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.App/containerApps/$CA_NAME?api-version=2024-03-01"
          if az containerapp show --name "$CA_NAME" --resource-group "$RG" --output none 2>/dev/null; then
            echo "Container app exists — updating image, env vars, ingress and registry in place."
            # Fetch via REST with the SAME api-version as the PUT below: the CLI's
            # GET uses a newer api-version whose response contains configuration
            # fields (identitySettings, runtime) that 2024-03-01 rejects on write.
            az rest --method get --url "$CA_URL" --output json > /tmp/ca-before.json
            jq \
              --arg image "$IMAGE" \
              --arg server "$REG_SERVER" \
              --arg user "$ACR_USER" \
              --arg pass "$ACR_PASS" \
              --arg asp "$ASPNET_ENV" \
              --arg jwt "$JWT_KEY" \
              --arg cors "$SWA_CORS" \
              --arg gcid "$GOOGLE_CLIENT_ID" \
              --arg base "$WEB_BASE" \
              --argjson env_sync_names "$(printf '%s\n' "${ENV_SYNC_NAMES[@]+"${ENV_SYNC_NAMES[@]}"}" | jq -R . | jq -s 'map(select(. != ""))')" \
              --argjson env_sync_values "$(printf '%s\n' "${ENV_SYNC_VALUES[@]+"${ENV_SYNC_VALUES[@]}"}" | jq -R . | jq -s 'map(select(. != ""))')" \
              --argjson env_sync_secrets "$(printf '%s\n' "${ENV_SYNC_SECRETS[@]+"${ENV_SYNC_SECRETS[@]}"}" | jq -R . | jq -s 'map(select(. != ""))')" \
              '
              del(.properties.provisioningState,
                  .properties.runningStatus,
                  .properties.latestRevisionName,
                  .properties.latestRevisionFqdn,
                  .properties.configuration.ingress.fqdn,
                  # May be present even on a same-version GET; unsupported for
                  # writes at 2024-03-01 — deleting falls back to defaults.
                  .properties.configuration.identitySettings,
                  .properties.configuration.runtime)
              | .properties.configuration = (.properties.configuration // {})
              | .properties.template = (.properties.template // {})
              | .properties.template.containers[0].image = $image
              | .properties.template.containers[0].env = (
                  ((.properties.template.containers[0].env // [])
                    | map(select(
                        .name != "ASPNETCORE_ENVIRONMENT"
                        and .name != "Database__Provider"
                        and .name != "Jwt__Key"
                        and .name != "Uploads__Path"
                        # Strip and re-add from $gcid so this list stays the
                        # single source of truth (no duplicate entries when a
                        # key was already present on the container).
                        and .name != "Auth__GoogleClientId"
                        and (if $cors == "" then true else .name != "Cors__AllowedOrigins__0" end)
                        and (if $base == "" then true else .name != "App__BaseUrl" end)
                         and ([.name] - [$env_sync_names[]] | length == 0 | not))))
                  + [
                      {name: "ASPNETCORE_ENVIRONMENT", value: $asp},
                      {name: "Database__Provider", value: "sqlserver"},
                      {name: "Jwt__Key", value: $jwt},
                      {name: "Uploads__Path", value: "/data/uploads"}
                    ]
                  + (if $gcid == "" then [] else [{name: "Auth__GoogleClientId", value: $gcid}] end)
                  + (if $cors == "" then [] else [{name: "Cors__AllowedOrigins__0", value: $cors}] end)
                  + (if $base == "" then [] else [{name: "App__BaseUrl", value: $base}] end)
                  + ([range(0; ($env_sync_names | length))] | map({
                      "name": $env_sync_names[.],
                      "value": (if $env_sync_secrets[.] == "true" then $env_sync_values[.] else $env_sync_values[.] end)
                    }))
                )
              | .properties.configuration.ingress = ((.properties.configuration.ingress // {})
                  * {external: true, targetPort: 8080, transport: "http", allowInsecure: false})
              # ARM GET never returns secret values, so any secret carried over
              # (notably the auto-generated registry secret from az containerapp
              # create, named "<sanitized-server>-<username>") would be written
              # back valueless -> ContainerAppSecretInvalid. This app is
              # workflow-managed with a single registry: rebuild registries and
              # secrets from our inputs — $server is the same REG_SERVER this
              # run pushed the image to, so app and image always agree.
              | .properties.configuration.registries = [
                  {server: $server, username: $user, passwordSecretRef: "acr-pwd"}
                ]
              | .properties.configuration.secrets = [
                  {name: "acr-pwd", value: $pass}
                ]
              ' /tmp/ca-before.json > /tmp/ca-after.json
            attempt=0
            until az rest --method put --url "$CA_URL" --body @/tmp/ca-after.json --output none; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 3 ]; then
                echo "::error::Failed to update container app '$CA_NAME'."
                exit 1
              fi
              echo "Update attempt $attempt failed; retrying in 20 seconds..."
              sleep 20
            done
          else
            echo "Container app does not exist — creating it."
            ENV_ARGS=(
              "ASPNETCORE_ENVIRONMENT=$ASPNET_ENV"
              "Database__Provider=sqlserver"
              "Jwt__Key=$JWT_KEY"
              "Uploads__Path=/data/uploads"
            )
            if [ -n "$GOOGLE_CLIENT_ID" ]; then
              ENV_ARGS+=("Auth__GoogleClientId=$GOOGLE_CLIENT_ID")
            fi
            if [ -n "$SWA_CORS" ]; then
              ENV_ARGS+=("Cors__AllowedOrigins__0=$SWA_CORS")
            fi
            if [ -n "$WEB_BASE" ]; then
              ENV_ARGS+=("App__BaseUrl=$WEB_BASE")
            fi
             for i in "${!ENV_SYNC_NAMES[@]}"; do
               [ -n "${ENV_SYNC_NAMES[$i]}" ] && [ -n "${ENV_SYNC_VALUES[$i]}" ] && ENV_ARGS+=("${ENV_SYNC_NAMES[$i]}=${ENV_SYNC_VALUES[$i]}")
             done
            az containerapp create \
              --name "$CA_NAME" --resource-group "$RG" \
              --environment "$ENV_ID" \
              --image "$IMAGE" \
              --registry-server "$REG_SERVER" \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASS" \
              --ingress external --target-port 8080 --transport http \
              --min-replicas 0 --max-replicas 3 \
              --env-vars "${ENV_ARGS[@]}" \
              --output none
          fi

          API_FQDN=$(az containerapp show --name "$CA_NAME" --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          if [ -z "$API_FQDN" ] || [ "$API_FQDN" = "None" ]; then
            echo "::error::Container app '$CA_NAME' has no ingress FQDN."
            exit 1
          fi
          echo "API: https://$API_FQDN"

          echo "=== 7/7 Smoke test: API ==="
          healthy=""
          body=""
          for i in $(seq 1 30); do
            body=$(curl -fsS -m 8 "https://$API_FQDN/health" 2>/dev/null || true)
            if printf '%s' "$body" | grep -q 'splitshare-api'; then
              healthy=1
              break
            fi
            sleep 6
          done
          if [ -z "$healthy" ]; then
            echo "::error::API /health did not become healthy within ~3 minutes."
            az containerapp revision list --name "$CA_NAME" --resource-group "$RG" --output table || true
            exit 1
          fi
          echo "API healthy: $body"

          echo "=== Azure SQL firewall (best-effort check) ==="
          SRG=$(az sql server list --query "[?name=='dbserver-splitshare'] | [0].resourceGroup" -o tsv 2>/dev/null || true)
          if [ -n "${SRG:-}" ] && [ "$SRG" != "None" ] && [ "$SRG" != "null" ]; then
            ALLOW=$(az sql server firewall-rule list --resource-group "$SRG" --server dbserver-splitshare \
              --query "[?startIpAddress=='0.0.0.0' || endIpAddress=='255.255.255.255'] | length(@)" \
              -o tsv 2>/dev/null || echo 0)
            if [ "${ALLOW:-0}" = "0" ] || [ "$ALLOW" = "None" ] || [ "$ALLOW" = "null" ]; then
              echo "::warning::No 'Allow Azure services' rule on dbserver-splitshare. If data endpoints return 503, allow Container Apps egress in the SQL firewall."
            fi
          fi

          echo "API deploy complete: https://$API_FQDN"
