name: api-container

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "servicedefaults/**"
      - ".github/workflows/api-container.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: api/Dockerfile
          registryUrl: ${{ vars.SPLITSHARE_REGISTRY_URL }}
          registryUsername: ${{ secrets.SPLITSHARE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SPLITSHARE_REGISTRY_PASSWORD }}
          containerAppName: splitshare
          resourceGroup: splitshare
          imageToBuild: ${{ vars.SPLITSHARE_REGISTRY_URL }}/splitshare:${{ github.sha }}
          targetPort: 8080
