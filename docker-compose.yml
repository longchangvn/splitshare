services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-module_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-module_platform}
      POSTGRES_DB: ${POSTGRES_DB:-splitshare}
    ports:
      - "5432:5432" # host localhost:5432 -> container 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-module_platform}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional SQL Server target (uncomment + set DB_PROVIDER=sqlServer, MSSQL_* in .env).
  # sqlserver:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   restart: unless-stopped
  #   environment:
  #     ACCEPT_EULA: "Y"
  #     MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-ChangeMe123!}
  #     MSSQL_PID: Express
  #   ports:
  #     - "1433:1433"

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # DB host/port are overridable so the API can point at a host-side
      # Postgres (e.g. env.remote) instead of the compose `db` service.
      # Resolution order in Program.cs: Database:Postgres (or :SqlServer) >
      # ConnectionStrings:module-platform > ConnectionStrings:Default.
      Database__Provider: ${DB_PROVIDER:-postgres}
      Database__Postgres: Host=${DB_HOST:-db};Port=${DB_PORT:-5432};Database=${POSTGRES_DB:-splitshare};Username=${POSTGRES_USER:-module_platform};Password=${POSTGRES_PASSWORD:-module_platform}
      # SQL Server target (used when DB_PROVIDER=sqlServer; needs a reachable SQL Server —
      # Azure SQL, or uncomment the sqlserver service below and set MSSQL_* in .env)
      Database__SqlServer: Server=${MSSQL_HOST:-sqlserver},${MSSQL_PORT:-1433};Database=${MSSQL_DB:-splitshare};User Id=${MSSQL_USER:-sa};Password=${MSSQL_PASSWORD:-};TrustServerCertificate=True
      ConnectionStrings__Default: Host=${DB_HOST:-db};Port=${DB_PORT:-5432};Database=${POSTGRES_DB:-splitshare};Username=${POSTGRES_USER:-module_platform};Password=${POSTGRES_PASSWORD:-module_platform}
      Jwt__Key: ${JWT_KEY:-dev-only-insecure-key-change-in-prod-0123456789}
      Uploads__Path: /data/uploads
      Cors__AllowedOrigins__0: ${WEB_URL:-http://localhost:3000}
      Cors__AllowedOrigins__1: http://localhost:3000
      Cors__AllowedOrigins__2: http://localhost:5173
      # Web origin used to build invite/share links (App:BaseUrl).
      App__BaseUrl: ${WEB_URL:-http://localhost:3000}
      # Push notifications: unset/null = no push (default); "onesignal" enables OneSignal REST.
      Notification__Provider: ${NOTIFICATION_PROVIDER:-}
      Notification__OneSignal__AppId: ${ONESIGNAL_APP_ID:-}
      Notification__OneSignal__ApiKey: ${ONESIGNAL_REST_API_KEY:-}
    ports:
      - "8081:8080"
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8081
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
